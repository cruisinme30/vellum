# Loads the Vellum dashboards into Grafana. Mount grafana/dashboards at
# /var/lib/grafana/dashboards/vellum.

apiVersion: 1

providers:
  - name: vellum
    folder: Vellum
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/vellum
