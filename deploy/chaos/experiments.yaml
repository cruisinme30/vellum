#
# The weekly faults, applied one at a time by run.sh while k6 runs: a
# Vellum node (and the collab rooms on it), a Kroki pod, the Postgres
# primary, which forces a Patroni failover to the synchronous replica, and
# a 20-second bucket outage (#191, ADR 0044 D188): the servers stay in
# rotation as degraded, writes in that window fail with 503 and are never
# acknowledged, and everything acknowledged before or after must survive.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-vellum-node
spec:
  action: pod-kill
  mode: one
  selector:
    labelSelectors:
      app.kubernetes.io/component: server
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-kroki
spec:
  action: pod-kill
  mode: one
  selector:
    labelSelectors:
      app.kubernetes.io/component: kroki
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-postgres-primary
spec:
  action: pod-kill
  mode: one
  selector:
    labelSelectors:
      application: spilo
      spilo-role: master
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: blob-outage
spec:
  action: partition
  mode: all
  direction: both
  duration: 20s
  selector:
    labelSelectors:
      app.kubernetes.io/component: server
  target:
    mode: all
    selector:
      labelSelectors:
        app: minio
