#
# The weekly faults, applied one at a time by run.sh while k6 runs: a
# Vellum node (and the collab rooms on it), a Kroki pod, the Postgres
# primary, which forces a Patroni failover to the synchronous replica, and
# a 20-second bucket outage (#191, ADR 0044 D188): the servers stay in
# rotation as degraded, writes in that window fail with 503 and are never
# acknowledged, and everything acknowledged before or after must survive.
# Last, every packet to and from the Postgres primary waits about 40 ms for
# 90 seconds (ADR 0022, D255). Vellum keeps shared counters and leases in
# Postgres, not Redis (ADR 0040), so the database faults cover a Redis one.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-vellum-node
spec:
  action: pod-kill
  mode: one
  selector:
    labelSelectors:
      app.kubernetes.io/component: server
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-kroki
spec:
  action: pod-kill
  mode: one
  selector:
    labelSelectors:
      app.kubernetes.io/component: kroki
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-postgres-primary
spec:
  action: pod-kill
  mode: one
  selector:
    labelSelectors:
      application: spilo
      spilo-role: master
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: blob-outage
spec:
  action: partition
  mode: all
  direction: both
  duration: 20s
  selector:
    labelSelectors:
      app.kubernetes.io/component: server
  target:
    mode: all
    selector:
      labelSelectors:
        app: minio
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: slow-postgres
spec:
  action: delay
  mode: all
  selector:
    labelSelectors:
      application: spilo
      spilo-role: master
  delay:
    latency: 40ms
    jitter: 10ms
    correlation: "25"
  duration: 90s
