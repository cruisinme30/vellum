{{/*
SPDX-FileCopyrightText: 2026 The Vellum contributors
SPDX-License-Identifier: AGPL-3.0-only

The key that signs CSRF tokens. Every replica must use the same one, or a
form loaded from one pod fails on the next (#434). Unless csrf.secret.name
names a secret you manage, the chart makes a random key once and keeps it
across upgrades and uninstalls.
*/}}
{{- if not .Values.csrf.secret.name }}
{{- $name := include "vellum.csrfSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vellum.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data .Values.csrf.secret.key) }}
  {{ .Values.csrf.secret.key }}:
    {{ index $existing.data .Values.csrf.secret.key }}
  {{- else }}
  {{ .Values.csrf.secret.key }}: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
