{{/*
SPDX-FileCopyrightText: 2026 The Vellum contributors
SPDX-License-Identifier: AGPL-3.0-only

The key replicas sign forwarded live-editing joins with (ADR 0037). Every
replica must use the same one. Unless cluster.secret.name names a secret
you manage, the chart makes a random key once and keeps it across
upgrades and uninstalls.
*/}}
{{- if not .Values.cluster.secret.name }}
{{- $name := include "vellum.clusterSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vellum.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data .Values.cluster.secret.key) }}
  {{ .Values.cluster.secret.key }}: {{ index $existing.data .Values.cluster.secret.key }}
  {{- else }}
  {{ .Values.cluster.secret.key }}: {{ randBytes 48 | b64enc | b64enc }}
  {{- end }}
{{- end }}
