#
# clamd for Vellum's upload scanner, shared by the compose stack and the
# Helm chart. Vellum streams each upload over TCP with INSTREAM.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 0.0.0.0

# Vellum accepts uploads up to 100 MiB, so clamd must read streams that big
# (#298). Many distribution packages ship 25M, which refuses every upload
# between 25 and 100 MiB. MaxFileSize (100M) and MaxScanSize (400M) keep
# ClamAV's defaults, which already cover a 100 MiB upload and its contents.
StreamMaxLength 100M

# Fail closed on what clamd cannot fully scan (red team round 4). Without
# these, clamd answers "OK" for an archive nested deeper than MaxRecursion,
# a member larger than MaxFileSize (a 100 KB zip that inflates to 101 MB),
# a scan that runs past MaxScanTime, or an encrypted archive, so malware
# inside any of them is stored as clean. With them, each is reported as a
# Heuristics.Limits.Exceeded or Heuristics.Encrypted finding, and Vellum
# refuses the upload.
AlertExceedsMax yes
AlertEncrypted yes
# One upload may hold a scanner thread for at most 30 seconds, the same
# budget Vellum's client waits.
MaxScanTime 30000
