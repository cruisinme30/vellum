#
# Defaults are the Organisation profile from the brief: no single point of
# failure. See ADR 0022 (D94, D95) for why each default is what it is.

image:
  repository: ghcr.io/cruisinme30/vellum
  # Defaults to the chart's appVersion.
  tag: ""
  # A digest (sha256:...) wins over the tag. Production should pin one.
  digest: ""
  pullPolicy: Always
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The external URL people open, with scheme and no trailing slash.
publicUrl: https://vellum.northstar.dev

# Stateless replicas; the autoscaler moves between min and max.
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
    ephemeral-storage: 1Gi

# Collab rooms and in-flight requests drain on shutdown (D94).
terminationGracePeriodSeconds: 45

log:
  level: info
  format: json
# OTLP/HTTP collector base URL; empty means no export.
otlpEndpoint: ""

# The passphrase that wraps the key-encryption key. Create the secret before
# installing: kubectl create secret generic vellum-kek --from-literal=passphrase=...
encryption:
  kekSecret:
    name: vellum-kek
    key: passphrase

# Blob storage: any S3-compatible bucket with versioning on.
blob:
  url: s3://vellum
  endpoint: ""
  region: us-east-1
  # Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Leave empty to
  # use workload identity (IRSA, GKE Workload Identity).
  credentialsSecret: ""

# Postgres, one cluster per shard. Shard key is space_id (D94).
postgres:
  # "operator": a Patroni cluster per shard through the Zalando Postgres
  # Operator (primary + synchronous replica, automatic failover).
  # "external": bring your own; externalSecret holds one URL per shard name.
  mode: operator
  operator:
    teamId: vellum
    version: "17"
    instances: 2
    volumeSize: 20Gi
    storageClass: ""
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 4Gi }
  externalSecret: vellum-postgres
  database: vellum

# Shards by space. Each entry gets its own Postgres cluster; the first is the
# home shard that holds the shard directory. Add shards, never rename them.
shards:
  - name: s0

kroki:
  enabled: true
  # Used when enabled is false: an existing Kroki URL.
  externalUrl: ""
  replicaCount: 2
  image:
    repository: yuzutech/kroki
    tag: 0.28.0
    digest: sha256:710a5e8d57344769846695431ceefc02aaf908e9958c9d459171d2255ee2f7f5
  excalidraw:
    repository: yuzutech/kroki-excalidraw
    tag: 0.28.0
    digest: sha256:fddd0bac124f259b5cbcae664b32fed9da1a8b2fda8d4cd8edf04e8349ee6ef8
  diagramsnet:
    repository: yuzutech/kroki-diagramsnet
    tag: 0.28.0
    digest: sha256:6139cb660c4a2526c2e2e0f7fff64b9b92ac4d8398f85fde53cf25bb6521383b
  resources:
    requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 128Mi }
    limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 512Mi }
  companionResources:
    requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi }
    limits: { cpu: "1", memory: 768Mi, ephemeral-storage: 512Mi }

# ClamAV scans every upload. Its config is files/clamd.conf, which streams
# up to 100 MiB, Vellum's upload limit. Each pod loads the full signature
# set (about 1.5 GiB of memory, twice that while it reloads them).
clamav:
  enabled: true
  # Used when enabled is false: an existing clamd as host:port. Leave it
  # empty with enabled false to run without virus scanning.
  externalAddress: ""
  replicaCount: 2
  image:
    repository: clamav/clamav
    tag: 1.5.4
    digest: sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
  resources:
    requests: { cpu: 200m, memory: 1536Mi, ephemeral-storage: 512Mi }
    limits: { cpu: "2", memory: 3Gi, ephemeral-storage: 2Gi }
  updaterResources:
    requests: { cpu: 20m, memory: 64Mi, ephemeral-storage: 64Mi }
    limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: vellum.northstar.dev
  tlsSecret: vellum-tls
  annotations: {}

# Canary 10 % -> 50 % -> 100 % with automatic rollback on SLO breach (D95).
# Needs the Argo Rollouts controller and a Prometheus that scrapes Vellum.
canary:
  enabled: false
  steps: [10, 50]
  pause: 10m
  prometheus:
    address: http://prometheus-operated.monitoring:9090
  # Abort and roll back when either breaches for two consecutive checks.
  maxErrorRatio: 0.001
  maxP95Seconds: 0.15
  interval: 1m

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
