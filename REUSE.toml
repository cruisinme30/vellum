version = 1

# Files whose format cannot carry a comment header. Vellum Markdown has no
# raw HTML, so documents in docs/ cannot hold an HTML comment header.
# book.yaml is rewritten by Vellum, which does not keep comments; golden
# corpus inputs must be byte-identical to the examples they come from.
[[annotations]]
path = [
  "Cargo.lock",
  "fuzz/Cargo.lock",
  "web/pnpm-lock.yaml",
  "web/package.json",
  "web/tsconfig.json",
  "web/knip.json",
  "web/.prettierrc.json",
  "web/public/manifest.webmanifest",
  "web/public/icons/**",
  "desktop/pnpm-lock.yaml",
  "desktop/package.json",
  "desktop/tsconfig.json",
  "desktop/tsconfig.build.json",
  "desktop/knip.json",
  "desktop/.prettierrc.json",
  ".markdownlint-cli2.jsonc",
  ".lycheeignore",
  ".vale/styles/config/vocabularies/**",
  "docs/**/*.md",
  "docs/**/book.yaml",
  "corpus/guide/**",
  "corpus/**/*.md",
  "corpus/**/*.json",
  ".gitmessage",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Vellum contributors"
SPDX-License-Identifier = "AGPL-3.0-only"
