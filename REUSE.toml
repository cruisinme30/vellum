version = 1

# Files whose format cannot carry a comment header. Vellum Markdown has no
# raw HTML, so documents in docs/ cannot hold an HTML comment header.
# book.yaml is rewritten by Vellum, which does not keep comments; golden
# corpus inputs must be byte-identical to the examples they come from.
[[annotations]]
path = [
  "Cargo.lock",
  "web/pnpm-lock.yaml",
  "web/package.json",
  "web/tsconfig.json",
  "web/knip.json",
  "web/.prettierrc.json",
  "schema/*.json",
  "web/public/manifest.webmanifest",
  "web/public/icons/**",
  "web/e2e/__screenshots__/**",
  "desktop/pnpm-lock.yaml",
  "desktop/package.json",
  "desktop/tsconfig.json",
  "desktop/tsconfig.build.json",
  "desktop/knip.json",
  "desktop/.prettierrc.json",
  ".markdownlint-cli2.jsonc",
  ".lycheeignore",
  ".vale/styles/config/vocabularies/**",
  "docs/**/*.md",
  "docs/**/book.yaml",
  "corpus/guide/**",
  "corpus/**/*.md",
  "corpus/**/*.json",
  "corpus/**/*.html",
  "corpus/**/*.txt",
  ".gitmessage",
  "deploy/perf/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Vellum contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Website screenshots, the tour video and its poster: binary files
# rendered from the Northstar demo design.
[[annotations]]
path = ["site/img/**", "site/media/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Vellum contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Google Sans Flex and Google Sans Code, self-hosted by the website.
[[annotations]]
path = ["site/fonts/google-sans-flex-*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2015 The Google Sans Flex Authors (https://github.com/googlefonts/googlesans-flex)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/fonts/google-sans-code-*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2025 The Google Sans Code Project Authors (https://github.com/googlefonts/googlesans-code)"
SPDX-License-Identifier = "OFL-1.1"
