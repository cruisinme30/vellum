extends: default

ignore: |
  web/node_modules/
  web/pnpm-lock.yaml
  desktop/node_modules/
  desktop/pnpm-lock.yaml
  target/
  # Helm templates are Go templates; helm lint checks them.
  deploy/helm/*/templates/

rules:
  # scripts/ci/check-line-length.sh holds YAML to 80 characters with the
  # same exemptions as every other file (pinned action hashes, URLs);
  # yamllint's own rule can't make them (ADR 0074).
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
