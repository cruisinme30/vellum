extends: default

ignore: |
  web/node_modules/
  web/pnpm-lock.yaml
  target/
  # Helm templates are Go templates; helm lint checks them.
  deploy/helm/*/templates/

rules:
  line-length:
    max: 120
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
