[[IgnoredVulns]]
# block-buffer 0.10.4 through digest 0.10 (hmac, sha1, sha2 for axum,
# tungstenite, sqlx). The bug needs a hasher that panics mid-update and is
# then reused after catch_unwind; no Vellum code catches a panic around a
# hasher, and 0.10 has no fixed release. Our own crates use 0.12.1.
id = "GHSA-qwgh-2vcv-g2f7"
reason = """\
    only reachable by reusing a hasher after a caught panic, which Vellum \
    never does; no fixed 0.10 release"""
