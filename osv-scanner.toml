# Advisories triaged as not affecting Vellum (ADR 0025, D261). OpenSSF
# Scorecard's Vulnerabilities check reads this file. The RUSTSEC entries
# mirror [advisories].ignore in deny.toml and .cargo/audit.toml, where the
# reasons are kept in full; change all three together.

