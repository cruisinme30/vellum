#
# Labels as code. The Labels workflow creates and updates these on every
# push to develop that changes this file; labels not listed here are left
# alone. Colours are hex without the leading #.

# Type, set from the pull request title
- name: type/feat
  color: "1d76db"
  description: "A new feature"
- name: type/fix
  color: "1d76db"
  description: "A bug fix"
- name: type/docs
  color: "1d76db"
  description: "Documentation only"
- name: type/refactor
  color: "1d76db"
  description: "Code change that neither fixes nor adds"
- name: type/perf
  color: "1d76db"
  description: "Performance improvement"
- name: type/test
  color: "1d76db"
  description: "Tests only"
- name: type/build
  color: "1d76db"
  description: "Build system or dependencies"
- name: type/ci
  color: "1d76db"
  description: "CI configuration and scripts"
- name: type/chore
  color: "1d76db"
  description: "Maintenance"
- name: type/style
  color: "1d76db"
  description: "Formatting only"
- name: type/revert
  color: "1d76db"
  description: "Reverts an earlier change"

