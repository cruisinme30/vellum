# Size, set from changed lines (generated files excluded)
- name: size/xs
  color: "c5def5"
  description: "Under 50 changed lines"
- name: size/s
  color: "c5def5"
  description: "50 to 199 changed lines"
- name: size/m
  color: "c5def5"
