# The fast suite: gates every pull request into develop, again in the merge
# queue, and is part of the full suite for main. Branch protection requires the "Fast suite" check.
name: "Checks: fast suite"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]
  # Used if the repository moves to an organisation and enables the merge
  # queue (scripts/admin/enable-merge-queue.sh).
  merge_group:
  workflow_call:
    inputs:
      full-suite:
        description: >-
          Called from the full suite, which runs the Rust tests (with
          coverage) and the whole UI suite itself, so they are not run twice.
        type: boolean
        default: false

# A newer run on the same pull request into develop cancels the older one
# (Gourav, 2026-10-29), so a batch pull request has one live run. Edits to
# the title or description wait instead, then check only the description.
# Pushes to develop, release pull requests into main, the merge queue and
# the full suite never cancel: each gets a group of its own.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && github.base_ref == 'develop'
    && format('fast-suite-pr-{0}', github.event.pull_request.number)
    || format('fast-suite-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' && github.base_ref == 'develop'
    && github.event.action != 'edited' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Which jobs this change needs (ADR 0035, D139). Pull requests into
  # develop and pushes to develop skip the Rust job for docs-only changes
  # and the Web job when web/ is untouched. The merge queue and the full
  # suite (release pull requests into main) run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # looks up earlier Fast suite runs of the same commit
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      web: ${{ steps.areas.outputs.web }}
      desktop: ${{ steps.areas.outputs.desktop }}
      files: ${{ steps.areas.outputs.files }}
      ui: ${{ steps.areas.outputs.ui }}
      warm: ${{ steps.areas.outputs.warm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent, the base.
          fetch-depth: 2
          persist-credentials: false
      # Editing a pull request's title or description starts a new run on
      # the same commit. When an earlier run of the same workflow on that
      # commit already passed, only the description checks run again.
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.base_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          # Runs started by the full suite are listed under full.yml.
          WORKFLOW: ${{ inputs.full-suite && 'full.yml' || 'ci.yml' }}
          FULL: ${{ inputs.full-suite && 'true' || 'false' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=0
          warm=false
          if [[ "${EVENT}" == "pull_request" && "${ACTION}" == "edited" ]]; then
            passed="$(gh api "repos/${GH_REPO}/actions/workflows/${WORKFLOW}/runs?head_sha=${SHA}&status=success" \
              --jq '.total_count' || echo 0)"
          fi
          # A merge commit on develop whose tree is exactly its pull
          # request's head was already tested on that pull request (the
          # integrator's batches), so its push run checks nothing again.
          if [[ "${EVENT}" == "push" ]] && git rev-parse --verify --quiet HEAD^2 >/dev/null &&
            [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse 'HEAD^2^{tree}')" ]]; then
            pr_head="$(git rev-parse HEAD^2)"
            passed="$(gh api "repos/${GH_REPO}/actions/workflows/${WORKFLOW}/runs?head_sha=${pr_head}&status=success" \
              --jq '.total_count' || echo 0)"
          fi
          if ((passed > 0)) && [[ "${EVENT}" == "push" ]] &&
            git diff --name-only HEAD^1 HEAD | scripts/ci/changed-areas.sh | grep -qx 'rust=true'; then
            # Only develop saves the Rust caches (D138), so the Rust jobs
            # still build, without checking again, to keep them warm for
            # the next batch (ADR 0049, D215).
            warm=true
          fi
          echo "warm=${warm}" | tee -a "${GITHUB_OUTPUT}"
          if ((passed > 0)); then
            echo "This commit already passed; checking the description only."
            printf 'rust=false\nweb=false\ndesktop=false\nui=false\nfiles=false\n' | tee -a "${GITHUB_OUTPUT}"
          elif [[ "${EVENT}" == "pull_request" && "${BASE}" == "develop" ]]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci/changed-areas.sh | tee -a "${GITHUB_OUTPUT}"
            echo "files=true" | tee -a "${GITHUB_OUTPUT}"
          elif [[ "${EVENT}" == "push" && -n "${BEFORE}" && "${BEFORE}" != 0000000* ]] &&
            git fetch --quiet --depth=1 origin "${BEFORE}"; then
            # A push to develop checks only the areas its commits touch.
            git diff --name-only "${BEFORE}" HEAD | scripts/ci/changed-areas.sh | tee -a "${GITHUB_OUTPUT}"
            echo "files=true" | tee -a "${GITHUB_OUTPUT}"
          elif [[ "${FULL}" == "true" ]]; then
            # The full suite runs every UI test in every browser itself.
            printf 'rust=true\nweb=true\ndesktop=true\nui=false\nfiles=true\n' | tee -a "${GITHUB_OUTPUT}"
          else
            printf 'rust=true\nweb=true\ndesktop=true\nui=true\nfiles=true\n' | tee -a "${GITHUB_OUTPUT}"
          fi

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only develop saves the cache (ADR 0035, D138). Pull requests
          # restore it; their own caches would fill the 10 GB limit and
          # evict develop's.
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny,cargo-audit,mdbook
      - name: Format
        if: needs.changes.outputs.warm != 'true'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Crate boundaries
        if: needs.changes.outputs.warm != 'true'
        run: cargo xtask boundaries
      - name: Block model is generated from schema/
        if: needs.changes.outputs.warm != 'true'
        run: cargo xtask schema --check
      - name: Help books and their corpus
        if: needs.changes.outputs.warm != 'true'
        run: cargo xtask help
      - name: Licences, bans, sources and advisories
        if: needs.changes.outputs.warm != 'true'
        run: cargo deny --locked check
      - name: RustSec audit
        if: needs.changes.outputs.warm != 'true'
        run: cargo audit --deny warnings

  rust-tests:
    # Its own job, so building and running the tests (the longest step)
    # starts at once instead of after clippy, docs and the policy checks
    # (ADR 0049, D215). The full suite runs these same tests in its
    # coverage job.
    name: Rust tests
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true') && !inputs.full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The cache key includes the job, so tests keep their own
          # build artefacts apart from clippy's. Only develop saves.
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          # The books tests build a published tree with mdBook.
          tool: cargo-nextest,mdbook
      - name: Tests
        env:
          WARM: ${{ needs.changes.outputs.warm }}
        run: |
          if [[ "${WARM}" == "true" ]]; then
            # A warm-up run builds the tests for the cache without running them.
            cargo nextest run --workspace --locked --profile ci --no-run
          else
            cargo nextest run --workspace --locked --profile ci
          fi

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Dead code
        run: pnpm run knip
      - name: Tests with coverage
        run: pnpm run test:coverage
      - name: Dependency audit
        run: pnpm audit

  website:
    # The site is built once for every UI shard: build-site.sh compiles
    # vellum-render's site_blocks example to draw the docs' diagrams
    # (ADR 0071, D309), which should not happen four times.
    name: Website build for the UI suite
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Keep in step with site.yml.
      MDBOOK_VERSION: 0.5.4
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          tarball="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${tarball}"
          echo "${MDBOOK_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" mdbook
          echo "MDBOOK=${RUNNER_TEMP}/mdbook" >> "${GITHUB_ENV}"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: site
          # Only develop saves the cache (ADR 0035, D138).
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: scripts/ci/build-site.sh _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: _site

  ui:
    # Four shards of four workers each (ADR 0049, D214). 334 tests took
    # 7.3 minutes on one runner; by 5:50 PM PT on 2026-10-29 there were
    # 962, and two shards took 8 to 9 minutes each.
    name: UI layout (quick ${{ matrix.shard }}/4)
    needs: [changes, website]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website
          path: _site
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Layout, focus and loading checks (ADR 0031)
        working-directory: web
        env:
          UI_SCOPE: quick
          UI_BROWSERS: chromium
          UI_VIEWPORTS: phone,laptop
          UI_SITE_DIR: ../_site
        run: pnpm exec playwright test e2e/ui --shard=${{ matrix.shard }}/4 --workers=4
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quick-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    env:
      # Unit tests do not start Electron, so skip the 100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Dead code
        run: pnpm run knip
      - name: Tests with coverage
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build
      - name: Dependency audit
        run: pnpm audit

  hygiene:
    name: Files, docs and secrets
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the pull request's commits
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: REUSE headers
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install linters
        # Every package pinned by hash (Scorecard "Pinned-Dependencies").
        run: pip install --require-hashes --no-deps -r .github/requirements/hygiene.txt
      - name: YAML
        run: yamllint --strict .
      - name: Shell
        run: shellcheck -x scripts/*/*.sh deploy/*/*.sh deploy/packages/linux/*.sh site/*.sh .githooks/*
      - name: Workflow security (zizmor)
        # ADR 0032, D126: template injection, excessive token permissions,
        # unpinned or impostor actions, credential persistence, cooldowns.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona=regular --min-severity=low --format=github .github
      - name: Decision records
        run: scripts/ci/check-adrs.sh
      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      - name: Prose (Vale)
        env:
          VALE_VERSION: 3.25.1
        run: |
          base="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}"
          curl -sSfL "${base}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar -xz -C "${RUNNER_TEMP}" vale
          "${RUNNER_TEMP}/vale" --glob='!{**/node_modules/**,target/**,LICENSES/**,LICENSE,corpus/**}' .
      - name: Local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Excluded paths are in lychee.toml, shared with `cargo xtask fast`.
          args: >-
            --offline --no-progress --include-fragments '**/*.md'
          fail: true
      - name: Secrets
        # The pull request already scanned these commits; the action does
        # not support merge queue events.
        if: github.event_name != 'merge_group'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Install hadolint and kube-score
        run: scripts/ci/install-infra-tools.sh
      - name: SQL, Docker, Compose, Helm and Kubernetes
        run: scripts/ci/lint-infra.sh

  commits:
    name: Commits and description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Branch name and title follow the conventions
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          source scripts/ci/commit-rules.sh
          if [[ "${BASE}" == "main" && "${BRANCH}" == "develop" ]]; then
            echo "Release pull request from develop."
          elif ! check_branch "${BRANCH}"; then
            echo "::error::Branch '${BRANCH}' must be named <type>/<topic>, e.g. feat/typed-ids"
            exit 1
          fi
          if [[ "${AUTHOR_TYPE}" == "Bot" ]] && check_bot_subject "${TITLE}"; then
            echo "Bot title: type checked, length not limited."
          elif ! check_subject "${TITLE}"; then
            echo "::error::Title is not a Conventional Commit: ${TITLE}"
            exit 1
          fi
      - name: Description follows the template
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/ci/check-pr-body.sh
      - name: Commit template and DCO sign-off
        run: >-
          scripts/ci/check-commits.sh
          ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  traceability:
    name: Issue and decision record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Linked issue, and a decision record for features
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/check-traceability.sh

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: No new dependency with a known vulnerability
        # ADR 0032, D126. Licences and bans stay with cargo deny.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  fast-suite:
    name: Fast suite
    if: always()
    needs: [changes, rust, rust-tests, web, desktop, website, ui, hygiene, commits, traceability, dependencies]
    runs-on: ubuntu-24.04
    steps:
      # A job skipped by the changed-areas filter counts as not applicable.
      - name: Every fast check passed or was not applicable
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Fast suite passed."
