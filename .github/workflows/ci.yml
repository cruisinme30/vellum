# The fast suite: gates every pull request into develop, again in the merge
# queue, and is part of the full suite for main. Branch protection requires the "Fast suite" check.
name: Fast suite

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]
  # Used if the repository moves to an organisation and enables the merge
  # queue (scripts/admin/enable-merge-queue.sh).
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to a long-lived
  # branch is checked to completion so its result stays meaningful.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Which jobs this change needs (ADR 0035, D139). Pull requests into
  # develop skip the Rust job for docs-only changes and the Web job when
  # web/ is untouched. Pushes, the merge queue and the full suite (release
  # pull requests into main) run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # looks up earlier Fast suite runs of the same commit
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      web: ${{ steps.areas.outputs.web }}
      desktop: ${{ steps.areas.outputs.desktop }}
      files: ${{ steps.areas.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent, the base.
          fetch-depth: 2
          persist-credentials: false
      # Editing a pull request's title or description starts a new run on
      # the same commit. When an earlier run on that commit already passed,
      # only the description checks run again.
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.base_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${EVENT}" == "pull_request" && "${BASE}" == "develop" ]]; then
            passed=0
            if [[ "${ACTION}" == "edited" ]]; then
              passed="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success" \
                --jq '.total_count' || echo 0)"
            fi
            if ((passed > 0)); then
              echo "This commit already passed the Fast suite; checking the description only."
              printf 'rust=false\nweb=false\ndesktop=false\nfiles=false\n' | tee -a "${GITHUB_OUTPUT}"
            else
              git diff --name-only HEAD^1 HEAD | scripts/ci/changed-areas.sh | tee -a "${GITHUB_OUTPUT}"
              echo "files=true" | tee -a "${GITHUB_OUTPUT}"
            fi
          else
            printf 'rust=true\nweb=true\ndesktop=true\nfiles=true\n' | tee -a "${GITHUB_OUTPUT}"
          fi

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only develop saves the cache (ADR 0035, D138). Pull requests
          # restore it; their own caches would fill the 10 GB limit and
          # evict develop's.
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit,mdbook
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Crate boundaries
        run: cargo xtask boundaries
      - name: Help books and their corpus
        run: cargo xtask help
      - name: Licences, bans, sources and advisories
        run: cargo deny --locked check
      - name: RustSec audit
        run: cargo audit --deny warnings

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Dead code
        run: pnpm run knip
      - name: Tests with coverage
        run: pnpm run test:coverage
      - name: Dependency audit
        run: pnpm audit

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    env:
      # Unit tests do not start Electron, so skip the 100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Dead code
        run: pnpm run knip
      - name: Tests with coverage
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build
      - name: Dependency audit
        run: pnpm audit

  hygiene:
    name: Files, docs and secrets
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the pull request's commits
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: REUSE headers
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install linters
        run: pip install yamllint==1.37.1 sqlfluff==3.4.2
      - name: YAML
        run: yamllint --strict .
      - name: Shell
        run: shellcheck -x scripts/*/*.sh deploy/*/*.sh .githooks/*
      - name: Decision records
        run: scripts/ci/check-adrs.sh
      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      - name: Prose (Vale)
        env:
          VALE_VERSION: 3.25.1
        run: |
          base="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}"
          curl -sSfL "${base}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar -xz -C "${RUNNER_TEMP}" vale
          "${RUNNER_TEMP}/vale" --glob='!{**/node_modules/**,target/**,LICENSES/**,LICENSE,corpus/**}' .
      - name: Local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path LICENSES --exclude-path web/node_modules
            --exclude-path corpus '**/*.md'
          fail: true
      - name: Secrets
        # The pull request already scanned these commits; the action does
        # not support merge queue events.
        if: github.event_name != 'merge_group'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Install hadolint and kube-score
        run: scripts/ci/install-infra-tools.sh
      - name: SQL, Docker, Compose, Helm and Kubernetes
        run: scripts/ci/lint-infra.sh

  commits:
    name: Commits and description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Branch name and title follow the conventions
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          source scripts/ci/commit-rules.sh
          if [[ "${BASE}" == "main" && "${BRANCH}" == "develop" ]]; then
            echo "Release pull request from develop."
          elif ! check_branch "${BRANCH}"; then
            echo "::error::Branch '${BRANCH}' must be named <type>/<topic>, e.g. feat/typed-ids"
            exit 1
          fi
          if ! check_subject "${TITLE}"; then
            echo "::error::Title is not a Conventional Commit: ${TITLE}"
            exit 1
          fi
      - name: Description follows the template
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/ci/check-pr-body.sh
      - name: Commit template and DCO sign-off
        run: >-
          scripts/ci/check-commits.sh
          ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  traceability:
    name: Issue and decision record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Linked issue, and a decision record for features
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/check-traceability.sh

  fast-suite:
    name: Fast suite
    if: always()
    needs: [changes, rust, web, desktop, hygiene, commits, traceability]
    runs-on: ubuntu-24.04
    steps:
      # A job skipped by the changed-areas filter counts as not applicable.
      - name: Every fast check passed or was not applicable
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Fast suite passed."
