# Nightly load test and security scan on the Team profile (docker compose)
# (ADR 0022, D96). The load test runs two Vellum replicas over one Postgres
# and bucket, and the k6 suite spreads its requests over both (#441). The
# suite must hold the SLO thresholds, a write on one replica must be read
# on the other within the lag threshold, and a p95 that grows 10 % or more
# over the median of the last five green nights fails the run (D254;
# deploy/perf/baseline.json until there are any). `vellum budgets` then
# fails the night when a route is over its p95 budget (R-OB-4). Hostile k6
# traffic and slow, idle clients (ADR 0047) run against the same stack,
# and ClamAV gets a flood of hostile uploads. ZAP runs its baseline scan
# against the same stack, and each fuzz target runs for five minutes. A
# night is skipped when develop has not changed
# since the last green night.
#
# On Sunday nights it also runs the chaos test on the Organisation profile:
# the Helm chart on kind with a Patroni Postgres, under k6 load, while Chaos
# Mesh kills a Vellum node, a Kroki pod and the Postgres primary, cuts
# the servers off the bucket and slows the database (D255). It fails when an SLO
# threshold breaks or an acknowledged write is lost. Release pull requests
# check the latest results of both (full.yml, D254).
name: "Scheduled: nightly load, security and fuzz, chaos on Sundays"

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "What to run"
        type: choice
        options: [nightly, chaos, both]
        default: nightly

permissions:
  contents: read

env:
  K6_VERSION: v2.3.0

jobs:
  # Nights when develop has not changed since the last green run are
  # skipped: the same commit would get the same result.
  changed:
    name: Develop changed since the last green night
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # reads the last successful run of this workflow
    outputs:
      run: ${{ steps.check.outputs.run }}
      chaos: ${{ steps.check.outputs.chaos }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${EVENT}" != "schedule" ]]; then
            [[ "${SUITE}" != "chaos" ]] && run=true || run=false
            [[ "${SUITE}" != "nightly" ]] && chaos=true || chaos=false
          else
            # Only scheduled runs count as a green night: a manual chaos-only
            # run must not make the next night skip its load test.
            runs="repos/${GH_REPO}/actions/workflows/nightly.yml/runs"
            last="$(gh api "${runs}?branch=develop&event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' || true)"
            if [[ -n "${last}" && "${last}" == "${GITHUB_SHA}" ]]; then
              echo "develop is still at ${GITHUB_SHA}, which passed last time; skipping tonight."
              run=false
            else
              run=true
            fi
            # The chaos test runs weekly, on Sunday nights (UTC).
            [[ "$(date -u +%u)" == 7 ]] && chaos=true || chaos=false
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "chaos=${chaos}" >> "${GITHUB_OUTPUT}"

  load:
    name: Load test (k6)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # downloads the summaries of the last green nights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        run: docker buildx build --load -t vellum:ci -f deploy/docker/Dockerfile .
      - name: Does the binary serve yet?
        id: serve
        run: |
          if deploy/compose/stack.sh has-serve vellum:ci; then
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::vellum has no serve command yet; the load test starts once it does."
          fi
      - name: Start the Team stack with two replicas
        if: steps.serve.outputs.ready == 'true'
        env:
          REPLICAS: "2"
        run: deploy/compose/stack.sh up vellum:ci nightly 7700
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: steps.serve.outputs.ready == 'true'
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Run the suite over both replicas
        if: steps.serve.outputs.ready == 'true'
        run: >-
          k6 run -e BASE_URLS=http://127.0.0.1:7700,http://127.0.0.1:7701
          -e SUMMARY=perf-summary.json deploy/perf/k6/suite.js
      - name: A write on one replica is read on the other
        if: always() && steps.serve.outputs.ready == 'true'
        run: >-
          k6 run -e BASE_URLS=http://127.0.0.1:7700,http://127.0.0.1:7701
          -e SUMMARY=replicas-summary.json deploy/perf/k6/replicas.js
      - name: Hold up under attack (hostile k6)
        if: always() && steps.serve.outputs.ready == 'true'
        run: >-
          k6 run -e BASE_URL=http://127.0.0.1:7700 -e DURATION=1m
          deploy/perf/k6/hostile.js
      - name: Hold up against slow and idle clients (slowloris, slow bodies, idle HTTP/2)
        if: always() && steps.serve.outputs.ready == 'true'
        run: python3 deploy/perf/hostile/slow_clients.py http://127.0.0.1:7700
      - name: Every route within its latency budget
        if: always() && steps.serve.outputs.ready == 'true'
        run: |
          token="$(deploy/perf/admin-token.sh http://127.0.0.1:7700)"
          echo "::add-mask::${token}"
          docker run --rm --network host -e VELLUM_TOKEN="${token}" vellum:ci \
            budgets --server http://127.0.0.1:7700
      - name: Install Rust for the gate
        if: always() && steps.serve.outputs.ready == 'true'
        run: rustup toolchain install
      - name: Fetch the last five green nights
        if: always() && steps.serve.outputs.ready == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p perf-history
          runs="repos/${GH_REPO}/actions/workflows/nightly.yml/runs"
          for id in $(gh api "${runs}?branch=develop&event=schedule&status=success&per_page=5" \
              --jq '.workflow_runs[].id'); do
            gh run download "${id}" --pattern 'perf-summary-*' --dir "perf-history/${id}" ||
              echo "Run ${id} kept no summary (a skipped night)."
          done
          # Only the suite's summary is a baseline; the artifact holds others.
          find perf-history -name '*.json' ! -name perf-summary.json -delete
      - name: No p95 grew 10 % or more over recent nights
        if: always() && steps.serve.outputs.ready == 'true'
        run: >-
          cargo run --locked --package xtask -- perf-gate
          --baseline deploy/perf/baseline.json --history perf-history
          --current perf-summary.json
      - name: Keep the result as trend data
        if: always() && steps.serve.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-summary-${{ github.run_id }}
          path: |
            perf-summary.json
            replicas-summary.json
          retention-days: 90
      - name: Server logs
        if: failure() && steps.serve.outputs.ready == 'true'
        run: deploy/compose/stack.sh compose nightly --profile replicas logs --tail 300

  scanner:
    name: Virus scanner under hostile uploads (ClamAV)
    # Nested, encrypted and bomb archives, EICAR and clean files, 56 at
    # once, through the upload check against a real clamd with the shipped
    # clamd.conf (ADR 0047). No upload may pass infected, none may hang.
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start ClamAV from the compose stack
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 900 clamav
      - name: Install Rust
        run: rustup toolchain install
      - name: Hostile uploads against the real clamd
        run: |
          ip="$(cd deploy/compose && docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            "$(docker compose ps -q clamav)")"
          VELLUM_TEST_CLAMD="${ip}:3310" cargo test --locked -p vellum-security \
            --test clamd_stress -- --ignored --test-threads 1 --nocapture
      - name: ClamAV logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs clamav

  zap:
    name: Security scan (ZAP baseline)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        run: docker buildx build --load -t vellum:ci -f deploy/docker/Dockerfile .
      - name: Does the binary serve yet?
        id: serve
        run: |
          if deploy/compose/stack.sh has-serve vellum:ci; then
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::vellum has no serve command yet; the ZAP scan starts once it does."
          fi
      - name: Start the Team stack
        if: steps.serve.outputs.ready == 'true'
        run: deploy/compose/stack.sh up vellum:ci zap 7700
      - name: ZAP baseline scan
        if: steps.serve.outputs.ready == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:7700
          rules_file_name: deploy/zap/rules.tsv
          cmd_options: -a -j
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

  fuzz:
    name: Fuzz ${{ matrix.target }}
    # Nightly only: a five-minute run per target is too slow for a pull
    # request and its result is not deterministic. Crashes upload as
    # artifacts; each one becomes an issue with a regression test.
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - format_roundtrip
          - formula
          - merge3
          - blob_path
          - collab_frames
          - mcp_messages
          - envelope
    defaults:
      run:
        working-directory: fuzz
    env:
      # cargo-fuzz sets its own sanitizer flags; nightly-only lints must
      # not fail the build.
      RUSTFLAGS: ""
      # yrs reserves with try_reserve; let a failed reservation return an
      # error instead of being reported as out of memory.
      ASAN_OPTIONS: allocator_may_return_null=1
      TOOLCHAIN: nightly-2026-10-28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "${TOOLCHAIN}" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - name: Keep the corpus between nights
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed the format corpus from the golden examples
        if: matrix.target == 'format_roundtrip'
        run: |
          mkdir -p corpus/format_roundtrip
          find ../corpus/format -name '*.md' -exec cp {} corpus/format_roundtrip/ \;
      - name: Fuzz for five minutes
        run: >-
          cargo "+${TOOLCHAIN}" fuzz run -O "${{ matrix.target }}" --
          -max_total_time=300 -rss_limit_mb=4096 -malloc_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  chaos:
    name: Chaos under load
    needs: changed
    if: needs.changed.outputs.chaos == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the images
        run: |
          docker buildx build --load -t vellum:ci -f deploy/docker/Dockerfile .
          docker buildx build --load -t vellum-minio:ci deploy/compose/minio
      - name: Does the binary serve yet?
        id: serve
        run: |
          if deploy/compose/stack.sh has-serve vellum:ci; then
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::vellum has no serve command yet; the chaos test starts once it does."
          fi
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.serve.outputs.ready == 'true'
        with:
          cluster_name: chaos
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.serve.outputs.ready == 'true'
        with:
          version: v3.19.0
      - name: Install the Postgres Operator and Chaos Mesh
        if: steps.serve.outputs.ready == 'true'
        run: |
          kind load docker-image vellum:ci vellum-minio:ci --name chaos
          helm install postgres-operator postgres-operator \
            --repo https://opensource.zalando.com/postgres-operator/charts/postgres-operator \
            --version 2.0.3 --wait
          helm install chaos-mesh chaos-mesh --repo https://charts.chaos-mesh.org --version 2.8.7 \
            --namespace chaos-mesh --create-namespace --wait \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath=/run/containerd/containerd.sock
      - name: Run the faults under load
        if: steps.serve.outputs.ready == 'true'
        run: deploy/chaos/run.sh
      - name: Cluster state
        if: failure() && steps.serve.outputs.ready == 'true'
        run: |
          kubectl get pods -A -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -80
          kubectl logs -l app.kubernetes.io/component=server --tail=200 --prefix
