# Pull request housekeeping. Runs as pull_request_target so it may write
# labels; it never checks out or runs the pull request's code, only the
# scripts on develop.
#   Labels (a required check): area from paths, type from title, size and
#     release; fails unless the pull request has a type/* and an area/* label.
#   Tracker: marks the task issues the pull request closes as in progress
#     while it is open, so the 1.0 tracker stays current.
name: "Checks: labels and tracker"

on:
  # It runs develop's scripts, never the pull request's code.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no PR code
    # Only events that can change a result. No labeled or unlabeled: the
    # Labels job sets labels itself, and re-running on each one used to
    # fill the runner queue. Edits run a job only when the title (Labels)
    # or the description (Tracker) changed.
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  # Labels is a required check, so it must also report in the merge queue.
  # The pull request was already labelled; the merge group passes.
  merge_group:

# A new push to a pull request into develop cancels its older Labels run.
# Closing never cancels, so the Tracker always records it, and release
# pull requests into main keep every run.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request_target'
    && github.base_ref == 'develop'
    && github.event.action != 'closed'
    && format('housekeeping-pr-{0}', github.event.pull_request.number)
    || format('housekeeping-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request_target'
    && github.base_ref == 'develop'
    && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  labels:
    name: Labels
    if: >-
      github.event_name == 'merge_group' ||
      contains(fromJSON(
        '["opened", "synchronize", "reopened", "ready_for_review"]'),
        github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.title != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Merge queue entries were labelled as pull requests
        if: github.event_name == 'merge_group'
        run: echo "Labels were checked on the pull request."
      - if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Area from changed paths
        if: github.event_name == 'pull_request_target'
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
      - name: Type, size and release; require type and area
        if: github.event_name == 'pull_request_target'
        run: scripts/ci/pr-labels.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

  tracker:
    name: Tracker
    if: >-
      github.event_name == 'pull_request_target' &&
      (contains(fromJSON('["opened", "reopened", "closed"]'),
        github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.body != null))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Mark linked task issues
        run: scripts/ci/tracker-status.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_STATE: ${{ github.event.pull_request.state }}
