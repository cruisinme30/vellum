# Builds the desktop app for macOS, Windows and Linux and attaches it to a
# draft GitHub release. A manual run may build unsigned; a tag push fails
# without the Apple secrets. Set these repository secrets (ADR 0023, D99):
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application, .p12 as base64)
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarisation)
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (code-signing certificate)
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # electron-builder uploads to the draft release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: vellum
          - os: windows-2025
            binary: vellum.exe
          - os: ubuntu-24.04
            binary: vellum
    env:
      VELLUM_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release builds restore no caches, so a poisoned cache can't reach a
      # signed release (ADR 0032).
      - run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Server binary (universal on macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p vellum-cli --target aarch64-apple-darwin
          cargo build --release --locked -p vellum-cli --target x86_64-apple-darwin
          lipo -create -output target/release/vellum \
            target/aarch64-apple-darwin/release/vellum target/x86_64-apple-darwin/release/vellum
      - name: Server binary
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p vellum-cli
      - name: Web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Desktop app
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          args=(--config electron-builder.yml --publish always)
          if [[ "${RUNNER_OS}" == "macOS" && -z "${APPLE_ID}" ]]; then
            # A tagged release never ships an unsigned macOS build (ADR 0023, D99).
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, CSC_LINK and CSC_KEY_PASSWORD"
              exit 1
            fi
            args+=(-c.mac.notarize=false)
          fi
          if [[ -z "${CSC_LINK}${WIN_CSC_LINK}" ]]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          pnpm exec electron-builder "${args[@]}"
