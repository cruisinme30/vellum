# Syncs .github/labels.yml to the repository's labels.
name: Sync labels

on:
  push:
    branches: [develop]
    paths: [.github/labels.yml, scripts/ci/sync-labels.sh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/sync-labels.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
