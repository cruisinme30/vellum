# Signed, reproducible releases (ADR 0022, D96). A tag vX.Y.Z on main:
#   1. builds the static binary twice per architecture and requires the
#      builds to be byte-identical (reproducible builds);
#   2. writes a CycloneDX SBOM of the source tree;
#   3. signs every file with Sigstore (keyless cosign) and records SLSA
#      level 3 provenance for the files and the image;
#   4. pushes the multi-arch image to GHCR built from those same binaries,
#      signed and with the SBOM attested;
#   5. publishes the GitHub release with all of it attached.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Tag is on main and matches the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Releases come from main only
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main."
            exit 1
          fi
      - name: The tag matches the workspace version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ "${declared}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} but Cargo.toml declares ${declared}."
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

  binaries:
    name: Reproducible binary (${{ matrix.arch }})
    needs: verify
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build twice from scratch
        run: |
          for n in 1 2; do
            docker buildx build --no-cache --target binary \
              --output "type=local,dest=${RUNNER_TEMP}/build-${n}" -f deploy/docker/Dockerfile .
          done
      - name: The builds are byte-identical
        run: cmp "${RUNNER_TEMP}/build-1/vellum" "${RUNNER_TEMP}/build-2/vellum"
      - name: Name the binary
        run: |
          mkdir -p dist
          cp "${RUNNER_TEMP}/build-1/vellum" "dist/vellum-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  assemble:
    name: SBOM, checksums and signatures
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless Sigstore signing
    outputs:
      subjects: ${{ steps.hashes.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: CycloneDX SBOM of the source tree (Rust and web)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/vellum-${{ needs.verify.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        id: hashes
        working-directory: dist
        run: |
          sha256sum -- * >SHA256SUMS
          echo "subjects=$(base64 -w0 SHA256SUMS)" >>"${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every file with Sigstore
        working-directory: dist
        run: |
          for file in vellum-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  provenance:
    name: SLSA provenance (files)
    needs: assemble
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA requires the generator to be referenced by tag, not by digest.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.assemble.outputs.subjects }}
      provenance-name: vellum.intoto.jsonl
      upload-assets: false

  image:
    name: Signed multi-arch image
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-files
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image from the released binaries and push it
        id: push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 --target runtime \
            --build-arg DIST=release --build-context release=dist \
            --build-arg "VERSION=${VERSION}" --build-arg "REVISION=${GITHUB_SHA}" \
            --provenance=false --sbom=false --metadata-file "${RUNNER_TEMP}/metadata.json" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" -f deploy/docker/Dockerfile .
          echo "digest=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")" >>"${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and attest its SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "dist/vellum-${VERSION}.cdx.json" "${IMAGE}@${DIGEST}"

  image-provenance:
    name: SLSA provenance (image)
    needs: image
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish the release
    needs: [verify, assemble, provenance, image, image-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vellum.intoto.jsonl
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cat >notes.md <<NOTES
          Image: \`${IMAGE}:${VERSION}\` (\`${DIGEST}\`), signed with Sigstore.

          Verify a binary before running it:

          \`\`\`sh
          cosign verify-blob vellum-linux-amd64 --bundle vellum-linux-amd64.sigstore.json \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          slsa-verifier verify-artifact vellum-linux-amd64 --provenance-path vellum.intoto.jsonl \\
            --source-uri github.com/${GITHUB_REPOSITORY} --source-tag ${GITHUB_REF_NAME}
          \`\`\`
          NOTES
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --title "Vellum ${VERSION}" --notes-file notes.md
