# The full suite: the fast suite plus the slower layers. Gates every pull
# request into main and runs nightly on the default branch (develop).
# Branch protection on main requires the "Full suite" check.
name: Full suite

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to a long-lived
  # branch is checked to completion so its result stays meaningful.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    name: Fast
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read
      actions: read

  coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest,cargo-llvm-cov,mdbook
      - name: Line coverage of at least 85 %
        run: >-
          cargo llvm-cov nextest --workspace --exclude xtask --locked
          --fail-under-lines 85 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: lcov.info

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --release --locked --package vellum-cli
      - name: Binary runs
        run: target/release/vellum --version

  image:
    name: Image, budgets and reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the binary twice from scratch
        run: |
          for n in 1 2; do
            docker buildx build --no-cache --target binary \
              --output "type=local,dest=${RUNNER_TEMP}/build-${n}" -f deploy/docker/Dockerfile .
          done
      - name: The two builds are byte-identical
        run: |
          sha256sum "${RUNNER_TEMP}"/build-*/vellum
          cmp "${RUNNER_TEMP}/build-1/vellum" "${RUNNER_TEMP}/build-2/vellum"
      - name: Build the image from that binary
        run: |
          mkdir -p "${RUNNER_TEMP}/dist"
          cp "${RUNNER_TEMP}/build-1/vellum" "${RUNNER_TEMP}/dist/vellum-linux-amd64"
          docker buildx build --load --target runtime \
            --build-arg DIST=release --build-context "release=${RUNNER_TEMP}/dist" \
            -t vellum:ci -f deploy/docker/Dockerfile .
      - name: Size, cold start, idle memory and drain within budget
        run: |
          image_bytes="$(docker save vellum:ci | gzip -9 | wc -c)"
          cargo run --locked --package xtask -- budgets \
            --binary "${RUNNER_TEMP}/build-1/vellum" --image-bytes "${image_bytes}"

  website:
    name: Website build for the UI suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep in step with site.yml.
      MDBOOK_VERSION: 0.5.4
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          tarball="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${tarball}"
          echo "${MDBOOK_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" mdbook
          echo "MDBOOK=${RUNNER_TEMP}/mdbook" >> "${GITHUB_ENV}"
      - run: scripts/ci/build-site.sh _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: _site

  e2e:
    name: End-to-end, UI and accessibility (${{ matrix.browser }} ${{ matrix.shard }}/4)
    needs: website
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The pinned Playwright image: the same browsers and fonts on every
    # machine, so visual baselines compare (ADR 0031). Keep its version
    # equal to @playwright/test in web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    env:
      HOME: /tmp
      UI_SCOPE: full
      UI_BROWSERS: ${{ matrix.browser }}
      UI_SITE_DIR: ../_site
      # Baselines exist for Chromium only.
      UI_VISUAL: ${{ matrix.browser == 'chromium' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website
          path: _site
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results

  links:
    name: External links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --exclude-path LICENSES --exclude-path web/node_modules
            '**/*.md'
          fail: true

  full-suite:
    name: Full suite
    if: always()
    needs: [fast, coverage, release-build, image, e2e, links]
    runs-on: ubuntu-24.04
    steps:
      - name: Every check passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Full suite passed."
