# The full suite: the fast suite plus the slower layers. Gates every pull
# request into main and runs nightly on the default branch (develop).
# Branch protection on main requires the "Full suite" check.
name: Full suite

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to a long-lived
  # branch is checked to completion so its result stays meaningful.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    name: Fast
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read

  coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest,cargo-llvm-cov,mdbook
      - name: Line coverage of at least 85 %
        run: >-
          cargo llvm-cov nextest --workspace --exclude xtask --locked
          --fail-under-lines 85 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: lcov.info

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --release --locked --package vellum-cli
      - name: Binary runs
        run: target/release/vellum --version

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/test-results

  links:
    name: External links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --exclude-path LICENSES --exclude-path web/node_modules
            '**/*.md'
          fail: true

  fuzz:
    name: Fuzz ${{ matrix.target }}
    # Nightly only: a five-minute run per target is too slow for a pull
    # request and its result is not deterministic. Crashes upload as
    # artifacts; each one becomes an issue with a regression test.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - format_roundtrip
          - formula
          - merge3
          - blob_path
          - collab_frames
          - mcp_messages
          - envelope
    defaults:
      run:
        working-directory: fuzz
    env:
      # cargo-fuzz sets its own sanitizer flags; nightly-only lints must
      # not fail the build.
      RUSTFLAGS: ""
      # yrs reserves with try_reserve; let a failed reservation return an
      # error instead of being reported as out of memory.
      ASAN_OPTIONS: allocator_may_return_null=1
      TOOLCHAIN: nightly-2026-10-28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${TOOLCHAIN}" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - name: Keep the corpus between nights
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed the format corpus from the golden examples
        if: matrix.target == 'format_roundtrip'
        run: |
          mkdir -p corpus/format_roundtrip
          find ../corpus/format -name '*.md' -exec cp {} corpus/format_roundtrip/ \;
      - name: Fuzz for five minutes
        run: >-
          cargo "+${TOOLCHAIN}" fuzz run -O "${{ matrix.target }}" --
          -max_total_time=300 -rss_limit_mb=4096 -malloc_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  full-suite:
    name: Full suite
    if: always()
    needs: [fast, coverage, release-build, e2e, links, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - name: Every check passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Full suite passed."
