# CodeQL code scanning (advanced setup), replacing the default setup that
# analysed every push and pull request (about 20 runner minutes each).
# It runs where its result matters:
# - release pull requests into main, which the main ruleset gates on
#   code scanning results;
# - pushes to main, so the next release pull request has a base analysis
#   to compare against and shows only new alerts;
# - weekly on develop, so alerts on the default branch stay current for
#   triage.
# Same languages and query suite as the default setup had.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1" # Mondays 05:29 UTC, on the default branch (develop)
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
