# Keeps the public "Vellum 1.0" GitHub Project in step with the task
# issues: on every issue change and every six hours. It needs the
# PROJECT_TOKEN secret (a token with the `project` scope), because the
# default GITHUB_TOKEN cannot write a user-owned project; without the
# secret the job is skipped. Runs only the script on the default branch.
name: Project sync

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the Vellum 1.0 project
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check for the project token
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [[ -n "${PROJECT_TOKEN}" ]]; then
            echo "present=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::PROJECT_TOKEN is not set; the project is not synced."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: Sync task issues to the project
        if: steps.token.outputs.present == 'true'
        run: scripts/ci/project-sync.sh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
