version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
