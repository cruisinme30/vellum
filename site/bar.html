<!-- The one site bar on every page of the website: the landing page, the
     docs home, every guide, the decision records and older releases'
     guides (ADR 0071, D310). scripts/ci/build-site.sh puts it in place of
     the SITEBAR placeholder and fills in @HOME@ (the site root), @DOCS@ (the docs
     home), @GUIDES@ (the folder of this release's guides), @VERSIONS@ and the @CUR-...@ markers, which become
     aria-current="page" on the link for the page's own section. -->

      <li><a href="@HOME@#tour"@CUR-product@>Product</a></li>
      <li><a href="@DOCS@"@CUR-docs@>Docs</a></li>
      <li><a href="@GUIDES@user/index.html"@CUR-user@>User guide</a></li>
      <li><a href="@GUIDES@admin/index.html"@CUR-admin@>Admin guide</a></li>
      <li><a href="@GUIDES@developer/index.html"@CUR-developer@>Developer guide</a></li>
      <li><a href="@GUIDES@decisions/index.html"@CUR-decisions@>Decisions</a></li>
