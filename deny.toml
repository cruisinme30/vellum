# cargo-deny: licences, advisories, banned crates and sources.
# CI runs `cargo deny check`; every finding fails the build.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # smallstr is unmaintained (no vulnerability); yrs 0.28 depends on it.
    # Drop this once yrs replaces it. Mirrored in .cargo/audit.toml.
    { id = "RUSTSEC-2026-0215", reason = "unmaintained, pulled by yrs; no safe upgrade yet" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Licences compatible with distributing Vellum under AGPL-3.0-only.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
# CC0-1.0 is a public-domain dedication, so it is compatible too. It is
# allowed per crate rather than globally because it has no patent grant.
exceptions = [
    { crate = "notify", allow = ["CC0-1.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Each skip names the older copy of a crate mid-way through an ecosystem
# upgrade, with the reason. Remove the entry once upstream catches up.
skip = [
    { crate = "syn@2", reason = "proc-macro ecosystem is moving from syn 2 to 3" },
    { crate = "getrandom@0.3", reason = "older crates still on 0.3 during the 0.4 move" },
    { crate = "r-efi@5", reason = "pulled by getrandom 0.3" },
    { crate = "base64@0.22", reason = "sqlx 0.9 is still on base64 0.22" },
    { crate = "hashbrown@0.16", reason = "sqlx-core 0.9 pins hashbrown 0.16; indexmap moved to 0.17" },
    { crate = "sha2@0.10", reason = "sqlx-core 0.9 is still on the RustCrypto 0.10 line" },
    { crate = "digest@0.10", reason = "RustCrypto 0.10 line, see sha2@0.10" },
    { crate = "block-buffer@0.10", reason = "RustCrypto 0.10 line, see sha2@0.10" },
    { crate = "crypto-common@0.1", reason = "RustCrypto 0.10 line, see sha2@0.10" },
    { crate = "cpufeatures@0.2", reason = "RustCrypto 0.10 line, see sha2@0.10" },
    { crate = "rand@0.9", reason = "bollard (testcontainers, tests only) is still on rand 0.9" },
    { crate = "rand_core@0.9", reason = "pulled by rand 0.9" },
    { crate = "getrandom@0.2", reason = "ring (rustls, testcontainers only) is still on getrandom 0.2" },
    { crate = "windows-sys@0.52", reason = "ring is still on windows-sys 0.52" },
    { crate = "miniz_oxide@0.8", reason = "png still on 0.8 while flate2 moved to 0.9" },
    { crate = "hashbrown@0.14", reason = "dashmap 6 (via yrs) has not moved to hashbrown 0.15+" },
    { crate = "base64@0.22", reason = "axum and tungstenite WebSocket handshakes are on base64 0.22" },
    { crate = "digest@0.10", reason = "the WebSocket handshake hashes with sha1 0.10; RustCrypto 0.11 elsewhere" },
    { crate = "block-buffer@0.10", reason = "pulled by digest 0.10 (WebSocket sha1)" },
    { crate = "crypto-common@0.1", reason = "pulled by digest 0.10 (WebSocket sha1)" },
    { crate = "cpufeatures@0.2", reason = "pulled by sha1 0.10 (WebSocket handshake)" },
    { crate = "hashbrown@0.16", reason = "sqlx-core 0.9 pins hashbrown 0.16; indexmap moved to 0.17" },
    { crate = "sha2@0.10", reason = "sqlx-core 0.9 is still on the RustCrypto 0.10 line" },
    { crate = "rand@0.9", reason = "bollard (testcontainers, tests only) and opentelemetry_sdk are still on rand 0.9" },
    { crate = "rand_core@0.9", reason = "pulled by rand 0.9" },
    { crate = "getrandom@0.2", reason = "ring (rustls) is still on getrandom 0.2" },
    { crate = "windows-sys@0.52", reason = "ring is still on windows-sys 0.52" },
    { crate = "windows-sys@0.59", reason = "fs4 (tantivy) is still on windows-sys 0.59" },
    { crate = "itertools@0.14", reason = "tantivy and prost-derive are on itertools 0.14; tract moved to 0.15" },
    { crate = "nom@7", reason = "tantivy-query-grammar is on nom 7; tract moved to nom 8" },
]
skip-tree = [
    # Linux Secret Service (os-keychain feature only) still uses the previous
    # RustCrypto generation (sha2 0.10, cipher 0.4) for its session encryption.
    { crate = "dbus-secret-service@4", depth = 20, reason = "Linux keychain; waiting for its RustCrypto 0.11 release" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
