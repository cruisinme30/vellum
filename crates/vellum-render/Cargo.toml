[package]
name = "vellum-render"
description = """\
    Rendering of the Vellum Markdown AST to sanitised HTML, charts and \
    diagrams."""
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "engine"

[lints]
workspace = true

[dependencies]
ammonia = "4.2.4"
material-colors = "0.5.0"
merman.version = "0.9.2"
merman.default-features = false
merman.features = ["all-diagrams", "svg", "layout-cytoscape"]
pulldown-latex = "0.8.0"
futures-util.version = "0.3.34"
futures-util.default-features = false
futures-util.features = ["alloc"]
reqwest.version = "0.13.5"
reqwest.default-features = false
reqwest.features = ["rustls"]
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syntect.version = "5.3.0"
syntect.default-features = false
syntect.features = ["default-syntaxes", "parsing", "html", "regex-fancy"]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tracing = "0.1.44"
vellum-format = { path = "../vellum-format" }
vellum-kernel.workspace = true

[dev-dependencies]
imagesize = "0.14.0"
proptest = "1.11.0"
tokio.version = "1.54.1"
tokio.features = ["macros", "rt-multi-thread", "net", "io-util"]
