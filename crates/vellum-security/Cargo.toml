[package]
name = "vellum-security"
description = "Request-level defences: SSRF guard, rate limits, upload hygiene and secret scanning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "foundation"

[lints]
workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
vellum-kernel.workspace = true
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = ">=1.11.0, <1.12"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
