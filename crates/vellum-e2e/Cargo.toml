[package]
name = "vellum-e2e"
description = "End-to-end encrypted private spaces on the server: device enrolment and the ciphertext members' devices read and write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
hex = "0.4.3"
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
tracing = "0.1.44"
vellum-contracts = { path = "../vellum-contracts" }
vellum-crypto = { path = "../vellum-crypto" }
vellum-kernel.workspace = true
vellum-security = { path = "../vellum-security" }
vellum-store = { path = "../vellum-store" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
