[package]
name = "vellum-search"
description = "Block-level, permission-filtered hybrid search over tantivy, Postgres or Meilisearch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid"] }
tantivy = "0.27"
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
tracing = "0.1"
tract-onnx = "0.23"
uuid = "1"
vellum-kernel.workspace = true
zeroize = "1.9"

[dev-dependencies]
proptest = ">=1.11.0, <1.12"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
