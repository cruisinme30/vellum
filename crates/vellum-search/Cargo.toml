[package]
name = "vellum-search"
description = "Block-level, permission-filtered hybrid search over tantivy, Postgres or Meilisearch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[features]
# Local sentence embeddings on tract (R-AI-7). Off by default: tract is
# about 12 MB of the server binary, and `vellum serve` does not wire a
# local model yet (ADR 0067, D280). The crate's own tests turn it on.
onnx = ["dep:tract-onnx"]

[dependencies]
async-trait = "0.1.92"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "migrate", "macros", "uuid"] }
tantivy = "0.27"
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
tracing = "0.1"
tract-onnx = { version = "0.23", optional = true }
uuid = "1"
vellum-authz = { path = "../vellum-authz" }
vellum-contracts = { path = "../vellum-contracts" }
vellum-db.workspace = true
vellum-format = { path = "../vellum-format" }
vellum-kernel.workspace = true
vellum-store = { path = "../vellum-store" }
zeroize = "1.9"

[dev-dependencies]
# Runs the ONNX tests with the workspace suite (see [features]).
vellum-search = { path = ".", features = ["onnx"] }
axum = { version = "0.8.9", default-features = false }
http = "1.5.0"
proptest = ">=1.11.0, <1.12"
prost = "0.14"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
vellum-api = { path = "../vellum-api" }
