[package]
name = "vellum-work"
description = "Work: Linear-class issue tracking over Vellum Markdown files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "engine"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-human-readable", "formatting", "parsing", "macros"] }
tracing = "0.1.44"
vellum-kernel.workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.154"
