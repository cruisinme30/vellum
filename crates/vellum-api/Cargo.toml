[package]
name = "vellum-api"
description = "The HTTP gateway: REST, GraphQL and webhooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "edge"

[lints]
workspace = true

[dependencies]
async-graphql.version = "7.2.1"
async-graphql.default-features = false
async-graphql.features = ["dynamic-schema"]
axum.version = "0.8.9"
axum.default-features = false
axum.features = [
    "form",
    "http1",
    "http2",
    "json",
    "matched-path",
    "query",
    "tokio",
    "tracing",
    "original-uri",
]
base64 = "0.23.1"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util.version = "0.1.21"
hyper-util.features = ["server-auto", "server-graceful", "tokio", "service"]
rustls.version = "0.23"
rustls.default-features = false
rustls.features = ["std", "aws_lc_rs", "logging"]
rustls-pki-types = { version = "1", features = ["std"] }
rustls-acme.version = "0.15.4"
rustls-acme.default-features = false
rustls-acme.features = ["aws-lc-rs", "tokio", "webpki-roots"]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio.version = "1.54.1"
tokio.features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"]
tokio-rustls.version = "0.26.6"
tokio-rustls.default-features = false
tokio-rustls.features = ["aws_lc_rs"]
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http.version = "0.6.11"
tower-http.features = [
    "catch-panic",
    "compression-br",
    "compression-gzip",
    "limit",
]
tracing = "0.1.44"
vellum-contracts.workspace = true
vellum-kernel.workspace = true
vellum-observe = { path = "../vellum-observe" }
vellum-security = { path = "../vellum-security" }

[target.'cfg(unix)'.dependencies]
# Reads and raises the open-file limit so the connection cap fits it.
rustix.version = "1.1.6"
rustix.default-features = false
rustix.features = ["process", "std"]

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
oas3 = { version = "0.22.0", default-features = false }
rcgen.version = "0.13.2"
rcgen.default-features = false
rcgen.features = ["aws_lc_rs", "pem"]
tower = { version = "0.5.3", features = ["util"] }
