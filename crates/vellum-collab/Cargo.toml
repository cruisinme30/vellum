[package]
name = "vellum-collab"
description = "Real-time collaboration rooms over the yrs CRDT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["ws"] }
bytes = "1.12.1"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
opentelemetry = "0.33.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
vellum-contracts = { path = "../vellum-contracts" }
vellum-crypto = { path = "../vellum-crypto" }
vellum-db = { path = "../vellum-db" }
vellum-format = { path = "../vellum-format" }
vellum-kernel.workspace = true
yrs = { version = "0.28.0", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
axum = { version = "0.8.9", default-features = false, features = ["ws", "tokio", "http1"] }
# proptest 1.12 moves to rand 0.10 while OpenTelemetry is on rand 0.9.
proptest = ">=1.11.0, <1.12"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "test-util"] }
tokio-tungstenite = "0.30"
