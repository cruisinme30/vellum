[package]
name = "vellum-format"
description = "The Vellum Markdown dialect: parser, AST and canonical serializer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "foundation"

[lints]
workspace = true

[dependencies]
comrak = { version = "0.59.0", default-features = false, features = ["attributes"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tracing = "0.1.44"
vellum-kernel.workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.154"
