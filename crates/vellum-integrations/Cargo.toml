[package]
name = "vellum-integrations"
description = """\
    Work integrations: Git automation, intake, imports, recurring issues, \
    insights and AI triage."""
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
axum.version = "0.8.9"
axum.default-features = false
axum.features = ["json", "tokio"]
base64 = "0.23.1"
hmac = "0.13.0"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
url = "2.5.8"
vellum-format = { path = "../vellum-format" }
vellum-kernel.workspace = true
vellum-work = { path = "../vellum-work" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
