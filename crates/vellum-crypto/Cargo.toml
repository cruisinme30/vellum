[package]
name = "vellum-crypto"
description = """\
    Envelope encryption at rest: per-object DEKs wrapped by a pluggable KEK \
    provider."""
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "foundation"

[lints]
workspace = true

[dependencies]
argon2.version = "0.6.0"
argon2.default-features = false
argon2.features = ["alloc", "zeroize"]
chacha20poly1305.version = "0.11.0"
chacha20poly1305.default-features = false
chacha20poly1305.features = ["alloc"]
getrandom = "0.4.3"
hkdf = "0.13.0"
keyring-core = { version = "1.0.1", optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
curve25519-dalek.version = "5.0.0"
curve25519-dalek.default-features = false
curve25519-dalek.features = ["zeroize"]
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.version = "1.0.2"
apple-native-keyring-store.optional = true
apple-native-keyring-store.features = ["keychain"]

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.version = "1.1.0"
windows-native-keyring-store.optional = true
windows-native-keyring-store.default-features = false

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store.version = "1.0.1"
dbus-secret-service-keyring-store.optional = true
dbus-secret-service-keyring-store.features = ["crypto-rust", "vendored"]

[features]
# Persist KEKs in the macOS Keychain, Windows Credential Manager or the
# Linux Secret Service.
os-keychain = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:dbus-secret-service-keyring-store",
]

# The desktop app opens E2E private-space envelopes in the browser via WASM.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
# proptest 1.12 moves to rand 0.10 while OpenTelemetry is on rand 0.9;
# cargo-deny bans the duplicate until they meet.
proptest = ">=1.11.0, <1.13"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
