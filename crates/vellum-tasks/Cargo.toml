[package]
name = "vellum-tasks"
description = "My Work: tasks projected from Markdown checklists, buckets, recurrence, quick-add, calendar feeds, imports and capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
hmac = "0.13.0"
jiff = "0.2.38"
mail-parser = { version = "0.11.9", default-features = false }
opentelemetry = "0.33.1"
quick-xml = "0.42.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tracing = "0.1.44"
vellum-contracts = { path = "../vellum-contracts" }
vellum-kernel.workspace = true

[dev-dependencies]
jiff = "0.2.38"
proptest = ">=1.11.0, <1.12"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
