[package]
name = "vellum-observe"
description = """\
    Observability: request traces, RED metrics, Server-Timing, client \
    telemetry, SLOs and flame graphs."""
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "foundation"

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
opentelemetry = "0.33.1"
schemars.version = "1"
schemars.default-features = false
schemars.features = ["std", "derive"]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber.version = "0.3.23"
tracing-subscriber.default-features = false
tracing-subscriber.features = ["registry", "std"]

[dev-dependencies]
proptest = ">=1.11.0, <1.13"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
vellum-kernel.workspace = true
