[package]
name = "vellum-identity"
description = "Accounts, cookie sessions, scoped API tokens, the OAuth 2.1 authorization server and break-glass admin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "json", "original-uri", "query", "tokio"] }
base64 = "0.23.1"
getrandom = "0.4"
http = "1.5.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["fs", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
url = "2.5.8"
vellum-contracts.workspace = true
vellum-db.workspace = true
vellum-kernel.workspace = true
vellum-security = { path = "../vellum-security" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
