[package]
name = "vellum-drive"
description = "The drive: spaces, folders, pages, trash, move and copy, shortcuts, stars, recents, activity, backlinks, quotas and version history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
opentelemetry = "0.33.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tracing = "0.1.44"
vellum-authz = { path = "../vellum-authz" }
vellum-kernel.workspace = true
vellum-store = { path = "../vellum-store" }

[dev-dependencies]
proptest = ">=1.11.0, <1.12"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
vellum-store = { path = "../vellum-store", features = ["conformance"] }
