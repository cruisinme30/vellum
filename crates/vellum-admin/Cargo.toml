[package]
name = "vellum-admin"
description = "The audit/admin service: audit log, admin settings, anonymous telemetry, backups and the admin console API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
opentelemetry = "0.33.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json"] }
schemars = { version = "1", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "sync", "rt"] }
tracing = "0.1.44"
vellum-contracts = { path = "../vellum-contracts" }
vellum-crypto = { path = "../vellum-crypto" }
vellum-kernel.workspace = true
vellum-observe = { path = "../vellum-observe" }

[dev-dependencies]
proptest = ">=1.11.0, <1.12"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
