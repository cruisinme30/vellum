[package]
name = "vellum-collections"
description = "The collections engine: schemas, rows, relations, rollups and formulas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "engine"

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
opentelemetry = "0.33.1"
serde = { version = "1.0.229", features = ["derive"] }
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
time = "0.3.55"
tracing = "0.1.44"
vellum-kernel.workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.154"
