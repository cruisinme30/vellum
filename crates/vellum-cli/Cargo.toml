[package]
name = "vellum-cli"
description = "The single `vellum` binary: server, CLI and MCP over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "app"

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
vellum-api = { path = "../vellum-api" }
vellum-contracts.workspace = true
vellum-help.workspace = true
vellum-kernel.workspace = true

[lints]
workspace = true
