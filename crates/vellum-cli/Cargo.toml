[package]
name = "vellum-cli"
description = "The single `vellum` binary: server, CLI and MCP over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "app"

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["original-uri"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
getrandom = "0.4"
hkdf = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
http = "1.5.0"
jiff = "0.2.38"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
lru = "0.18.5"
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-std", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = "1.29.0"
vellum-admin = { path = "../vellum-admin" }
vellum-api = { path = "../vellum-api" }
vellum-authz = { path = "../vellum-authz" }
vellum-books = { path = "../vellum-books" }
vellum-books-service = { path = "../vellum-books-service" }
vellum-collab = { path = "../vellum-collab" }
vellum-collections = { path = "../vellum-collections" }
vellum-contracts.workspace = true
vellum-crypto = { path = "../vellum-crypto", features = ["os-keychain"] }
vellum-db.workspace = true
vellum-drive = { path = "../vellum-drive" }
vellum-e2e = { path = "../vellum-e2e" }
vellum-export = { path = "../vellum-export" }
vellum-format = { path = "../vellum-format" }
vellum-help.workspace = true
vellum-identity = { path = "../vellum-identity" }
vellum-integrations = { path = "../vellum-integrations" }
vellum-jobs = { path = "../vellum-jobs" }
vellum-kernel.workspace = true
vellum-mcp = { path = "../vellum-mcp" }
vellum-notify = { path = "../vellum-notify" }
vellum-observe = { path = "../vellum-observe" }
vellum-private = { path = "../vellum-private", features = ["os-keychain"] }
vellum-render = { path = "../vellum-render" }
vellum-search = { path = "../vellum-search", features = ["onnx"] }
vellum-security = { path = "../vellum-security" }
vellum-store = { path = "../vellum-store", features = ["s3"] }
vellum-tasks = { path = "../vellum-tasks" }
vellum-work = { path = "../vellum-work" }
vellum-work-service = { path = "../vellum-work-service" }

[dev-dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
hmac = "0.13.0"
http-body-util = "0.1.3"
serde_urlencoded = "0.7.1"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
vellum-search = { path = "../vellum-search", features = ["test-support"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
