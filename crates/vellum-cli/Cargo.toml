[package]
name = "vellum-cli"
description = "The single `vellum` binary: server, CLI and MCP over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "app"

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4"
http = "1.5.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-std", "macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
url = "2.5.8"
vellum-admin = { path = "../vellum-admin" }
vellum-api = { path = "../vellum-api" }
vellum-authz = { path = "../vellum-authz" }
vellum-books-service = { path = "../vellum-books-service" }
vellum-collections = { path = "../vellum-collections" }
vellum-contracts.workspace = true
vellum-db.workspace = true
vellum-drive = { path = "../vellum-drive" }
vellum-help.workspace = true
vellum-identity = { path = "../vellum-identity" }
vellum-kernel.workspace = true
vellum-mcp = { path = "../vellum-mcp" }
vellum-security = { path = "../vellum-security" }
vellum-store = { path = "../vellum-store" }
vellum-work = { path = "../vellum-work" }
vellum-work-service = { path = "../vellum-work-service" }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false }
http-body-util = "0.1.3"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
