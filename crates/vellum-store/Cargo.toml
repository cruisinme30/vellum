[package]
name = "vellum-store"
description = "The blob store port and its adapters (local folder, S3, Git and cloud drives)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "foundation"

[lints]
workspace = true

[features]
# Exposes the storage adapter conformance suite to other crates' tests.
conformance = []
# Git work tree with commit per save batch and merge-based sync.
git = ["tokio/process", "tokio/fs", "tokio/io-util"]
# Remote adapters, one feature each. `remote` is their shared HTTP layer.
remote = ["dep:reqwest", "dep:serde", "dep:serde_json"]
# Dropbox, on the Dropbox API v2.
dropbox = ["remote"]
# OneDrive and SharePoint document libraries via Microsoft Graph.
onedrive = ["remote"]

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
diff-match-patch-rs = "0.5.1"
diffy = "0.5.2"
futures = "0.3.34"
hex = "0.4.3"
notify = "8.2.0"
opentelemetry = "0.33.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.49.0", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
vellum-kernel.workspace = true

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
proptest = ">=1.11.0, <1.12"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
vellum-store = { path = ".", features = ["conformance", "git", "dropbox", "onedrive"] }
