[package]
name = "vellum-store"
description = "The blob store port and its adapters (local folder, S3, Git and cloud drives)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "foundation"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
hex = "0.4.3"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.49.0", features = ["rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
proptest = "1.12.0"
