[package]
name = "vellum-store"
description = "The blob store port and its adapters (local folder, S3, Git and cloud drives)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "foundation"

[lints]
workspace = true

[features]
# Exposes the storage adapter conformance suite to other crates' tests.
conformance = []

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
diff-match-patch-rs = "0.5.1"
diffy = "0.5.2"
futures = "0.3.34"
hex = "0.4.3"
notify = "8.2.0"
opentelemetry = "0.33.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.49.0", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
vellum-kernel.workspace = true

[dev-dependencies]
proptest = ">=1.11.0, <1.12"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
vellum-store = { path = ".", features = ["conformance"] }
