[package]
name = "vellum-assist"
description = """\
    Bring-your-own-model features: summarise, ask this space with citations, \
    draft from a template."""
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"
vellum-contracts.workspace = true
vellum-kernel.workspace = true
vellum-security = { path = "../vellum-security" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util"] }
