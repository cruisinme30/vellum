[package]
name = "vellum-export"
description = "Export to PDF, Word and Google Docs; import from Word, Google Docs, Notion, Confluence, Outline and Markdown folders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
csv = "1.4.0"
futures = "0.3.34"
opentelemetry = "0.33.1"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
resvg = { version = "0.47.0", default-features = false, features = ["text"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tracing = "0.1.44"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
url = "2.5.8"
vellum-format = { path = "../vellum-format" }
vellum-kernel.workspace = true
vellum-render = { path = "../vellum-render" }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = ">=1.11.0, <1.12"
vellum-jobs = { path = "../vellum-jobs" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
