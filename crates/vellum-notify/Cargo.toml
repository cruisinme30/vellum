[package]
name = "vellum-notify"
description = "The notifications and webhooks service: signed webhooks, in-app, email and web push."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
jiff = { version = "0.2.38", features = ["serde"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"
vellum-security = { path = "../vellum-security" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt"] }
