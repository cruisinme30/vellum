[package]
name = "vellum-private"
description = """\
    The private agent: opens end-to-end encrypted spaces on the member's own \
    device, for local search and MCP."""
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "edge"

[lints]
workspace = true

[features]
# The device key in the OS keychain (macOS Keychain, Windows Credential
# Manager, the Linux Secret Service).
os-keychain = ["vellum-crypto/os-keychain"]

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr.version = "2.0.0"
serde-saphyr.default-features = false
serde-saphyr.features = ["deserialize"]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
vellum-crypto = { path = "../vellum-crypto" }
vellum-format = { path = "../vellum-format" }
vellum-kernel.workspace = true
vellum-search = { path = "../vellum-search" }
vellum-store = { path = "../vellum-store" }

[dev-dependencies]
bytes = "1"
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
zeroize = "1.9.1"
