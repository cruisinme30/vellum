[package]
name = "vellum-sync"
description = "The sync service behind the local-first clients: push/pull of named mutations and record changes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.vellum]
layer = "service"

[lints]
workspace = true

[dependencies]
schemars = { version = "1", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
vellum-kernel.workspace = true

[dev-dependencies]
proptest = ">=1.11.0, <1.12"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
