[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/cruisinme30/vellum"
publish = false

[workspace.dependencies]
vellum-db = { path = "crates/vellum-db" }
vellum-help = { path = "crates/vellum-help" }
vellum-kernel = { path = "crates/vellum-kernel" }

# The lint baseline from the engineering standards. CI runs with
# `-D warnings`, so every `warn` below fails the build.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_results = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
large_futures = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
