[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/cruisinme30/vellum"
publish = false

[workspace.dependencies]
vellum-contracts = { path = "crates/vellum-contracts" }
vellum-db = { path = "crates/vellum-db" }
vellum-help = { path = "crates/vellum-help" }
vellum-kernel = { path = "crates/vellum-kernel" }

# The lint baseline from the engineering standards. CI runs with
# `-D warnings`, so every `warn` below fails the build.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_results = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
large_futures = "warn"

# Debug and test builds keep line numbers for backtraces but drop the full
# debug info: about 140 test binaries link faster, and the CI cache and
# cloud sandboxes' target directories shrink (ADR 0049, D215).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Mermaid rendering runs per request and is about a sixth of the binary's
# code, so it is optimised for size (ADR 0067, D280).
# The website's site_blocks build (ADR 0071, D309): release speed without
# fat LTO, so the Website workflow builds it in a few minutes.
[profile.site]
inherits = "release"
lto = false
codegen-units = 16

