# Decision record and decision numbers handed out before the record is on
# a pushed branch (ADR 0049, D216). `cargo xtask adr next` treats them as
# taken, and scripts/ci/check-adrs.sh fails when two reservations overlap.
# One [[reservation]] per holder. `decisions` is "DNNN" or "DNNN-DNNN";
# `adrs`, when present, is "NNNN" or "NNNN-NNNN". A reservation can stay
# after its record lands; it only keeps the numbers from being reused.

[[reservation]]
decisions = "D205-D213"
holder = "collections (D205-D207), desktop (D208-D210), upload route (D211-D213)"

[[reservation]]
decisions = "D217-D261"
holder = "16 threads, allocated by the coordinator on 2026-10-29; see the project memory registry"

[[reservation]]
adrs = "0050-0064"
holder = "15 gap workstreams: workstream n gets ADR 0049+n (drive UI, workstream 3, gets 0052)"

[[reservation]]
decisions = "D267-D270"
holder = "reliability gates thread: degraded modes (#191) and the page render cache (#74), ADR 0061"
